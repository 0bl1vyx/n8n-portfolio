<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study | Priyo Das</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        accent: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
                        slate: { 850: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-300 font-sans antialiased min-h-screen flex flex-col selection:bg-accent-500/30 selection:text-white">

    <nav class="w-full border-b border-white/5 glass-panel sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition flex items-center gap-2 group font-mono">
                <span class="text-accent-500 group-hover:-translate-x-1 transition-transform"><-</span>
                cd ..
            </a>
            <div class="text-sm font-bold text-white tracking-tight font-mono opacity-50">
                /projects/<span id="nav-title">loading...</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        
        <div id="loading" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-2 border-slate-700 border-t-accent-500 rounded-full animate-spin"></div>
            <p class="mt-4 text-slate-500 font-mono text-xs">Fetching Data...</p>
        </div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-700">
            
            <header class="mb-12 border-b border-white/5 pb-12">
                <div class="flex flex-wrap gap-2 mb-6" id="tags-container"></div>
                <h1 id="p-title" class="text-3xl md:text-5xl font-bold text-white mb-6 leading-tight"></h1>
                <p id="p-desc" class="text-xl text-slate-400 leading-relaxed max-w-3xl"></p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-4 space-y-6 order-2 lg:order-1">
                    <div class="glass-panel p-6 rounded-xl">
                        <h3 class="text-white font-semibold mb-4 text-xs font-mono uppercase tracking-wider text-slate-500">Classification</h3>
                        <p id="p-type" class="text-white font-medium"></p>
                    </div>

                    <div class="glass-panel p-6 rounded-xl">
                        <h3 class="text-white font-semibold mb-4 text-xs font-mono uppercase tracking-wider text-slate-500">Tech Stack</h3>
                        <ul id="tech-list" class="space-y-3 text-sm font-mono text-slate-300"></ul>
                    </div>
                </div>

                <div class="lg:col-span-8 space-y-12 order-1 lg:order-2">
                    <div class="glass-panel p-1 rounded-xl mb-8 overflow-hidden shadow-2xl">
                        <img id="p-image" src="" alt="Project Screenshot" class="w-full h-auto rounded-lg opacity-90 hover:opacity-100 transition duration-500">
                    </div>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-4 flex items-center gap-3">
                            <span class="text-accent-500 font-mono">01.</span> The Challenge
                        </h2>
                        <p id="p-problem" class="text-slate-400 leading-relaxed"></p>
                    </section>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-4 flex items-center gap-3">
                            <span class="text-accent-500 font-mono">02.</span> The Solution
                        </h2>
                        <div class="relative pl-6 border-l border-accent-500/30">
                            <p id="p-solution" class="text-slate-300 leading-relaxed"></p>
                        </div>
                    </section>

                    <section>
                        <div class="bg-gradient-to-br from-slate-800/50 to-slate-900/50 border border-white/5 p-8 rounded-xl relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-accent-500/10 rounded-full blur-2xl -mr-16 -mt-16 group-hover:bg-accent-500/20 transition duration-500"></div>
                            <h2 class="text-accent-400 font-bold mb-3 text-sm font-mono uppercase tracking-wide">Result & Impact</h2>
                            <p id="p-result" class="text-white font-medium text-lg leading-relaxed relative z-10"></p>
                        </div>
                    </section>
                </div>
            </div>
            
            <div class="mt-20 pt-10 border-t border-white/5 flex justify-between items-center">
                 <a href="index.html" class="text-sm font-mono text-slate-500 hover:text-white transition">
                    &lt; ~/root
                </a>
                <a href="mailto:priyo@example.com" class="bg-white text-black hover:bg-slate-200 px-6 py-2 rounded font-medium text-sm transition-colors">
                    Hire Me for This
                </a>
            </div>
        </div>
    </main>

    <script>
        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) {
                    document.getElementById('loading').innerHTML = "Error: Project 404";
                    return;
                }

                // Populate Data
                document.getElementById('nav-title').innerText = project.id; // Nice touch for the nav
                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-type').innerText = project.type;
                document.getElementById('p-image').src = project.image;
                
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-[10px] font-bold uppercase tracking-wider text-accent-400 bg-accent-900/10 border border-accent-500/20 px-2 py-1 rounded">${tag}</span>`;
                });

                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `
                        <li class="flex items-center gap-3">
                            <span class="text-accent-500">></span>
                            ${tech}
                        </li>`;
                });

                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => { content.classList.remove('opacity-0'); }, 50);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = "System Error: Could not retrieve data.";
            }
        }

        loadProjectDetails();
    </script>
</body>
</html>
