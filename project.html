<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: { 400: '#4ade80', 500: '#22c55e', 900: '#14532d' },
                        void: { bg: '#09090b', card: '#18181b', border: '#27272a' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #d4d4d8; }
        .tech-border {
            border: 1px solid #27272a;
            position: relative;
        }
        /* Corner accents for that "tech" look */
        .tech-border::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid #22c55e; border-left: 2px solid #22c55e;
        }
        .tech-border::after {
            content: ''; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px;
            border-bottom: 2px solid #22c55e; border-right: 2px solid #22c55e;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="w-full border-b border-void-border bg-void-bg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-14 flex justify-between items-center">
            <a href="index.html" class="text-xs font-mono text-gray-500 hover:text-white transition flex items-center gap-2 group">
                <span class="text-primary-500 font-bold">&lt;</span> cd ..
            </a>
            <div id="status-light" class="w-2 h-2 rounded-full bg-primary-500 shadow-[0_0_10px_#22c55e]"></div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        
        <div id="loading" class="py-20 font-mono text-primary-500 text-sm animate-pulse">
            > decrypting_project_data...
        </div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-500">
            
            <header class="mb-12">
                <div class="flex flex-wrap gap-2 mb-4 font-mono text-xs" id="tags-container"></div>
                <h1 id="p-title" class="text-3xl md:text-5xl font-bold text-white mb-6"></h1>
                <p id="p-desc" class="text-lg text-gray-400 font-light max-w-2xl"></p>
            </header>

            <div class="tech-border p-1 bg-void-card/50 mb-12 rounded-sm">
                <div class="overflow-hidden relative h-64 md:h-96 w-full bg-black">
                    <img id="p-image" src="" class="w-full h-full object-cover opacity-75" alt="System Visualization">
                    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-4 space-y-8 order-2 lg:order-1">
                    <div class="p-6 border border-void-border bg-void-card/30 rounded-lg">
                        <h3 class="text-white font-bold mb-1 text-xs font-mono uppercase text-gray-500">Architecture Type</h3>
                        <p id="p-type" class="text-primary-400 font-mono text-sm"></p>
                    </div>

                    <div class="p-6 border border-void-border bg-void-card/30 rounded-lg">
                        <h3 class="text-white font-bold mb-4 text-xs font-mono uppercase text-gray-500">Tech Stack</h3>
                        <ul id="tech-list" class="space-y-2 text-sm text-gray-300 font-mono"></ul>
                    </div>
                </div>

                <div class="lg:col-span-8 space-y-12 order-1 lg:order-2">
                    <section>
                        <h2 class="text-lg text-white font-bold mb-4 flex items-center gap-3 font-mono">
                            <span class="text-red-500">01</span> // THE BOTTLENECK
                        </h2>
                        <p id="p-problem" class="text-gray-400 leading-relaxed border-l border-void-border pl-6"></p>
                    </section>

                    <section>
                        <h2 class="text-lg text-white font-bold mb-4 flex items-center gap-3 font-mono">
                            <span class="text-primary-500">02</span> // THE AUTOMATION
                        </h2>
                        <div class="relative pl-6 border-l border-primary-500/30">
                            <p id="p-solution" class="text-gray-300 leading-relaxed"></p>
                        </div>
                    </section>

                    <section class="relative group mt-8">
                        <div class="absolute -inset-1 bg-gradient-to-r from-primary-600 to-emerald-600 rounded-lg blur opacity-20 group-hover:opacity-40 transition duration-1000"></div>
                        <div class="relative bg-void-card border border-void-border p-8 rounded-lg">
                            <h2 class="text-primary-500 font-bold mb-2 text-xs font-mono uppercase tracking-widest">
                                SYSTEM OUTPUT
                            </h2>
                            <p id="p-result" class="text-white text-xl font-medium"></p>
                        </div>
                    </section>
                </div>
            </div>

            <div class="mt-20 pt-10 border-t border-void-border flex flex-col md:flex-row justify-between items-center gap-6">
                <p class="text-sm text-gray-500 font-mono">End of Report.</p>
                <a href="mailto:your-email@gmail.com" class="px-8 py-3 bg-white text-black font-bold text-sm hover:bg-gray-200 transition-colors rounded-sm font-mono">
                    DEPLOY THIS SYSTEM
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-gray-800 text-xs font-mono">
        SECURE CONNECTION ESTABLISHED
    </footer>

    <script>
        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) { window.location.href = 'index.html'; return; }

            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) {
                    document.getElementById('loading').innerHTML = "ERROR: 404_PROJECT_NOT_FOUND";
                    return;
                }

                // Inject Data
                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-type').innerText = project.type;
                document.getElementById('p-image').src = project.image;
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-primary-500 border border-primary-900 bg-primary-900/10 px-2 py-1 rounded-sm">#${tag}</span>`;
                });

                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `<li class="flex items-center gap-2"><span class="text-primary-500">></span> ${tech}</li>`;
                });

                // Reveal
                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => content.classList.remove('opacity-0'), 50);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = "FATAL ERROR: CONNECTION_REFUSED";
            }
        }
        loadProjectDetails();
    </script>
</body>
</html>
