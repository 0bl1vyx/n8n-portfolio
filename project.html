<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        neon: { 400: '#4ade80', 500: '#22c55e', 900: '#14532d' },
                        dark: { bg: '#050505', card: '#0a0a0a', border: '#262626' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #d1d5db;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="w-full border-b border-dark-border bg-dark-bg">
        <div class="max-w-4xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="text-sm font-mono text-gray-500 hover:text-white transition flex items-center gap-2 group">
                <span class="text-neon-500 group-hover:-translate-x-1 transition-transform"><-</span>
                Back to Terminal
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        
        <div id="loading" class="text-center py-20 font-mono text-neon-500 animate-pulse">
            > Fetching project data...
        </div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-500">
            
            <div class="mb-12">
                <div class="flex flex-wrap gap-2 mb-4" id="tags-container"></div>
                <h1 id="p-title" class="text-4xl md:text-5xl font-bold text-white mb-6"></h1>
                <p id="p-desc" class="text-xl text-gray-400 font-light"></p>
            </div>

            <div class="w-full h-64 md:h-96 bg-dark-card border border-dark-border rounded-lg mb-12 flex items-center justify-center overflow-hidden">
                <img id="p-image" src="" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition duration-700" alt="Workflow Visualization">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-12 border-t border-dark-border pt-12">
                
                <div class="md:col-span-1 space-y-8">
                    <div>
                        <h3 class="text-white font-bold mb-2 text-sm font-mono uppercase">Project Type</h3>
                        <p id="p-type" class="text-neon-400"></p>
                    </div>

                    <div>
                        <h3 class="text-white font-bold mb-2 text-sm font-mono uppercase">Stack Used</h3>
                        <ul id="tech-list" class="space-y-2 text-sm text-gray-400 font-mono"></ul>
                    </div>
                </div>

                <div class="md:col-span-2 space-y-10">
                    <section>
                        <h2 class="text-xl text-white font-bold mb-3 flex items-center gap-2">
                            <span class="text-red-500 font-mono">01.</span> The Problem
                        </h2>
                        <p id="p-problem" class="text-gray-400 leading-relaxed"></p>
                    </section>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-3 flex items-center gap-2">
                            <span class="text-neon-500 font-mono">02.</span> My Solution
                        </h2>
                        <div class="pl-4 border-l-2 border-neon-900">
                            <p id="p-solution" class="text-gray-300 leading-relaxed"></p>
                        </div>
                    </section>

                    <section class="bg-dark-card border border-dark-border p-6 rounded-lg">
                        <h2 class="text-white font-bold mb-2 font-mono uppercase text-sm text-neon-500">
                            > Outcome
                        </h2>
                        <p id="p-result" class="text-white text-lg font-medium"></p>
                    </section>
                </div>
            </div>

            <div class="mt-24 text-center">
                <h3 class="text-white font-bold text-2xl mb-6">Need a system like this?</h3>
                <a href="mailto:your-email@gmail.com" class="inline-block bg-neon-600 hover:bg-neon-500 text-black font-bold px-8 py-4 rounded transition-all hover:scale-105">
                    Start Conversation
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center py-8 text-gray-700 text-sm border-t border-dark-border mt-12">
        &copy; 2026 Priyo Das.
    </footer>

    <script>
        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) { window.location.href = 'index.html'; return; }

            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) {
                    document.getElementById('loading').innerHTML = "Project Not Found";
                    return;
                }

                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-type').innerText = project.type;
                document.getElementById('p-image').src = project.image;
                
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-xs font-mono text-neon-500 border border-neon-900 bg-neon-900/10 px-2 py-1 rounded">${tag}</span>`;
                });

                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `<li>> ${tech}</li>`;
                });

                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => content.classList.remove('opacity-0'), 50);

            } catch (error) {
                console.error(error);
            }
        }
        loadProjectDetails();
    </script>
</body>
</html>
