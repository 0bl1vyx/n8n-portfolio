<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study | Priyo Das</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }, // Trustworthy Blue
                        slate: { 850: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            /* Professional mesh gradient matching homepage */
            background-image: 
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.10) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(30, 58, 138, 0.10) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-300 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-500/30 selection:text-white">

    <nav class="w-full border-b border-white/5 glass-panel">
        <div class="max-w-5xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition flex items-center gap-2 group">
                <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Home
            </a>
            <div class="text-lg font-bold text-white tracking-tight">
                Priyo<span class="text-slate-500 font-normal">.Automates</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        
        <div id="loading" class="text-center py-20 text-slate-500 animate-pulse">
            Loading case study data...
        </div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-700">
            
            <div class="mb-10">
                <div class="flex flex-wrap gap-2 mb-6" id="tags-container">
                    </div>
                <h1 id="p-title" class="text-3xl md:text-5xl font-bold text-white mb-6 leading-tight"></h1>
                <p id="p-desc" class="text-xl text-slate-400 leading-relaxed max-w-3xl"></p>
            </div>

            <div class="glass-panel p-2 rounded-xl mb-12 shadow-2xl shadow-black/50">
                <img id="p-image" src="" alt="Project Screenshot" class="w-full h-auto rounded-lg border border-slate-700/50">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                
                <div class="md:col-span-1 space-y-6">
                    <div class="glass-panel p-6 rounded-xl">
                        <h3 class="text-white font-semibold mb-4 text-xs uppercase tracking-wider text-slate-500">Project Type</h3>
                        <p id="p-type" class="text-brand-500 font-bold text-lg"></p>
                    </div>

                    <div class="glass-panel p-6 rounded-xl">
                        <h3 class="text-white font-semibold mb-4 text-xs uppercase tracking-wider text-slate-500">Tech Stack</h3>
                        <ul id="tech-list" class="space-y-3 text-sm text-slate-300">
                            </ul>
                    </div>
                </div>

                <div class="md:col-span-2 space-y-12">
                    <section>
                        <h2 class="text-2xl text-white font-bold mb-4 flex items-center gap-3">
                            The Challenge
                        </h2>
                        <p id="p-problem" class="text-slate-400 leading-relaxed text-lg"></p>
                    </section>

                    <section>
                        <h2 class="text-2xl text-white font-bold mb-4 flex items-center gap-3">
                            The Solution
                        </h2>
                        <div class="relative pl-6 border-l-2 border-brand-500/30">
                            <p id="p-solution" class="text-slate-300 leading-relaxed text-lg"></p>
                        </div>
                    </section>

                    <section>
                        <div class="bg-brand-900/20 border border-brand-500/20 p-8 rounded-xl">
                            <h2 class="text-brand-500 font-bold mb-3 text-sm uppercase tracking-wide">Business Impact</h2>
                            <p id="p-result" class="text-white font-medium text-xl leading-relaxed"></p>
                        </div>
                    </section>
                </div>
            </div>

            <div class="mt-24 text-center border-t border-slate-800/50 pt-16">
                <h3 class="text-2xl text-white font-bold mb-6">Need a similar workflow?</h3>
                <a href="mailto:your-email@gmail.com" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-500 text-white px-8 py-3 rounded-lg font-semibold transition-all shadow-lg shadow-brand-900/20 hover:translate-y-[-2px]">
                    Discuss Your Project
                </a>
            </div>
        </div>
    </main>

    <footer class="text-center py-8 text-slate-600 text-sm">
        &copy; 2026 Priyo D.
    </footer>

    <script>
        async function loadProjectDetails() {
            // 1. Get ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (!projectId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // 2. Fetch Data
                const response = await fetch('projects.json');
                const projects = await response.json();
                
                // 3. Find specific project
                const project = projects.find(p => p.id === projectId);

                if (!project) {
                    document.getElementById('loading').innerHTML = "Error: Project not found.";
                    return;
                }

                // 4. Populate Data
                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-type').innerText = project.type; // Mapped to 'type' not 'price'
                document.getElementById('p-image').src = project.image;
                
                // Deep details
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                // Tags
                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-xs font-medium text-brand-400 bg-brand-900/30 border border-brand-500/20 px-3 py-1 rounded-full">${tag}</span>`;
                });

                // Tech Stack
                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `
                        <li class="flex items-center gap-3">
                            <div class="w-1.5 h-1.5 bg-brand-500 rounded-full"></div>
                            ${tech}
                        </li>`;
                });

                // 5. Reveal Content
                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                
                // Small delay to trigger the transition
                setTimeout(() => {
                    content.classList.remove('opacity-0');
                }, 50);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = "System Error: Could not retrieve data.";
            }
        }

        loadProjectDetails();
    </script>
</body>
</html>
