    <style>
        body { 
            background-color: #050505; 
            color: #e5e5e5; 
            cursor: none; 
            overflow-x: hidden;
        }

        /* --- FX LAYERS --- */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .aurora-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .aurora-blob {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: blob 20s infinite alternate;
            opacity: 0.6;
        }
        .aurora-1 { top: -20%; left: -10%; }
        .aurora-2 { bottom: -20%; right: -10%; background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0) 70%); animation-delay: -5s; }

        /* --- UI COMPONENTS --- */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; pointer-events: none; z-index: 9999;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: #4ade80; }
        .cursor-outline {
            width: 40px; height: 40px; border: 1px solid rgba(74, 222, 128, 0.3);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        @media (pointer: coarse) {
            .cursor-dot, .cursor-outline { display: none; }
            body { cursor: auto; }
        }
        body.hovering .cursor-outline {
            width: 60px; height: 60px; 
            background-color: rgba(74, 222, 128, 0.05);
            border-color: #4ade80;
        }

        /* --- SKELETON LOADER --- */
        .skeleton {
            background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

    <script>
        // --- CURSOR LOGIC ---
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        let mouseX = -100, mouseY = -100;
        let outlineX = -100, outlineY = -100;

        document.addEventListener('mousemove', (e) => { 
            mouseX = e.clientX; 
            mouseY = e.clientY; 
            cursorDot.style.left = `${mouseX}px`;
            cursorDot.style.top = `${mouseY}px`;
        });

        function animateCursor() {
            let distX = mouseX - outlineX;
            let distY = mouseY - outlineY;
            outlineX += distX * 0.15; 
            outlineY += distY * 0.15;
            cursorOutline.style.left = `${outlineX}px`;
            cursorOutline.style.top = `${outlineY}px`;
            requestAnimationFrame(animateCursor);
        }
        
        if (window.matchMedia("(pointer: fine)").matches) { animateCursor(); }

        function cursorHover() { document.body.classList.add('hovering'); }
        function cursorLeave() { document.body.classList.remove('hovering'); }

        // --- LIGHTBOX LOGIC ---
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lb.classList.remove('hidden');
            setTimeout(() => lb.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
            
            // Close on escape key
            document.addEventListener('keydown', handleEsc);
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('opacity-0');
            setTimeout(() => {
                lb.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
            document.removeEventListener('keydown', handleEsc);
        }

        function handleEsc(e) { if(e.key === 'Escape') closeLightbox(); }

        // --- DATA LOADER ---
        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            if (!projectId) { window.location.href = 'index.html'; return; }

            try {
                // Simulate slight network delay for smooth skeleton transition
                // await new Promise(r => setTimeout(r, 600)); 

                const response = await fetch('projects.json');
                if (!response.ok) throw new Error("Database offline");
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) {
                     document.body.innerHTML = "<div class='flex h-screen items-center justify-center text-red-500 font-mono'>Error 404: Project Data Not Found</div>";
                     return;
                }

                // Inject Text Content
                document.title = `${project.title} | System Architecture`;
                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-metric').innerText = project.metric;
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                // Handle Tags
                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `
                        <span class="px-3 py-1 rounded border border-white/10 bg-white/5 text-[10px] uppercase font-mono tracking-wider text-accent-400">
                            ${tag}
                        </span>
                    `;
                });

                // Handle Tech Stack (Styled pills)
                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `
                        <span class="px-3 py-1.5 rounded-md bg-white/5 hover:bg-white/10 text-xs text-gray-300 border border-white/5 transition-colors cursor-default">
                            ${tech}
                        </span>
                    `;
                });

                // Handle Images
                let images = Array.isArray(project.images) ? project.images : [project.image];
                if(images.length > 0) {
                    document.getElementById('p-main-image').src = images[0];
                }
                
                // Gallery Thumbnails
                const gallery = document.getElementById('gallery-grid');
                if (images.length > 1) {
                    images.forEach((imgSrc, index) => {
                        const activeClass = index === 0 ? 'ring-2 ring-accent-500' : '';
                        gallery.innerHTML += `
                            <div class="h-20 rounded-lg overflow-hidden border border-white/10 cursor-pointer hover:opacity-80 transition-opacity ${activeClass}" 
                                 onclick="openLightbox('${imgSrc}')">
                                <img src="${imgSrc}" class="w-full h-full object-cover">
                            </div>
                        `;
                    });
                } else {
                    gallery.style.display = 'none';
                }

                // Handle Video
                if (project.video_embed && project.video_embed !== "") {
                    const videoContainer = document.getElementById('video-container');
                    const videoFrame = document.getElementById('p-video');
                    videoFrame.src = project.video_embed;
                    videoContainer.classList.remove('hidden');
                }

                // Handle Download Button
                if (project.workflow_download && project.workflow_download !== "") {
                    const btn = document.getElementById('btn-download');
                    btn.href = project.workflow_download;
                    btn.classList.remove('hidden');
                }

                // Reveal UI
                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => content.classList.remove('opacity-0'), 50);

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <div class="p-4 border border-red-500/20 bg-red-500/10 rounded text-red-400 font-mono text-center">
                        SYSTEM ERROR: CONNECTION REFUSED
                    </div>`;
            }
        }
        
        loadProjectDetails();
    </script>
