<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { accent: { 400: '#34d399', 500: '#10b981', 600: '#059669' }, bg: { main: '#0a0a0a', card: '#111111', border: '#262626' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #d4d4d8; }
        .lightbox { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="lightbox" class="fixed inset-0 z-[100] bg-black/95 hidden flex justify-center items-center p-4 opacity-0 cursor-zoom-out" onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-full max-h-full rounded-lg shadow-2xl border border-bg-border object-contain">
        <div class="absolute top-4 right-4 text-white font-mono text-sm bg-bg-card border border-bg-border px-3 py-1 rounded cursor-pointer">CLOSE [X]</div>
    </div>

    <nav class="w-full border-b border-bg-border bg-bg-main sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Back to Projects
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        <div id="loading" class="py-20 text-center text-gray-500 font-mono animate-pulse">Loading System Data...</div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-500">
            <header class="mb-8">
                <div class="flex flex-wrap gap-2 mb-6" id="tags-container"></div>
                <h1 id="p-title" class="text-3xl md:text-5xl font-bold text-white mb-6 leading-tight"></h1>
                <p id="p-desc" class="text-lg text-gray-400 font-light max-w-2xl"></p>
            </header>

            <div class="mb-16">
                <div class="rounded-xl overflow-hidden border border-bg-border bg-bg-card relative group cursor-zoom-in" onclick="openLightbox(this.querySelector('img').src)">
                    <img id="p-main-image" src="" class="w-full h-64 md:h-[500px] object-cover opacity-90 group-hover:opacity-100 transition-opacity" alt="Main Workflow">
                    <div class="absolute bottom-4 right-4 bg-black/50 backdrop-blur text-xs text-white px-3 py-1 rounded font-mono">CLICK TO ENLARGE</div>
                </div>
                
                <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-4 space-y-8 order-2 lg:order-1">
                    <div class="p-6 border border-bg-border bg-bg-card rounded-xl">
                        <h3 class="text-gray-500 font-mono text-xs uppercase mb-1">Impact Metric</h3>
                        <p id="p-metric" class="text-accent-400 font-bold text-2xl"></p>
                    </div>

                    <div class="p-6 border border-bg-border bg-bg-card rounded-xl">
                        <h3 class="text-gray-500 font-mono text-xs uppercase mb-4">Tech Stack</h3>
                        <ul id="tech-list" class="space-y-3 text-sm text-gray-300"></ul>
                    </div>
                    
                    <div class="flex flex-col gap-3">
                        <a href="mailto:priyodas567@gmail.com" class="w-full py-4 bg-accent-600 hover:bg-accent-500 text-white text-center font-bold rounded-lg transition-all shadow-[0_4px_14px_0_rgba(34,197,94,0.39)]">
                            Hire Me to Build This
                        </a>
                        
                        <a id="btn-download" href="#" target="_blank" class="hidden w-full py-4 border border-bg-border text-gray-400 hover:text-white hover:border-white transition-colors text-center font-mono text-sm rounded-lg flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            View Workflow JSON
                        </a>
                    </div>
                </div>

                <div class="lg:col-span-8 space-y-12 order-1 lg:order-2">
                    
                    <div id="video-container" class="mb-12 hidden">
                        <div class="relative w-full pb-[56.25%] bg-bg-card border border-bg-border rounded-xl overflow-hidden shadow-[0_0_30px_-10px_rgba(74,222,128,0.1)]">
                            <iframe 
                                id="p-video" 
                                class="absolute top-0 left-0 w-full h-full" 
                                src="" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <span class="text-xs font-mono text-accent-500 animate-pulse">● LIVE SYSTEM DEMO</span>
                            <span class="text-xs font-mono text-gray-500">Watch full walkthrough</span>
                        </div>
                    </div>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-4">The Challenge</h2>
                        <p id="p-problem" class="text-gray-400 leading-relaxed text-lg font-light"></p>
                    </section>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-4">The Solution</h2>
                        <p id="p-solution" class="text-gray-400 leading-relaxed text-lg font-light"></p>
                    </section>
                    
                    <section class="bg-bg-card border border-bg-border p-8 rounded-xl">
                        <h2 class="text-accent-500 font-mono text-xs uppercase tracking-widest mb-3">FINAL OUTPUT</h2>
                        <p id="p-result" class="text-white text-xl font-medium"></p>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-12 text-gray-600 text-xs font-mono border-t border-bg-border mt-12">
        <div class="flex justify-center gap-6 mb-4">
             <a href="mailto:priyodas567@gmail.com" class="hover:text-white transition">Email</a>
             <a href="https://www.linkedin.com/in/0bl1vyx/" class="hover:text-white transition">LinkedIn</a>
             <a href="https://github.com/0bl1vyx" class="hover:text-white transition">GitHub</a>
        </div>
        &copy; 2026 Priyo Das
    </footer>

    <script>
        // LIGHTBOX LOGIC
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lb.classList.remove('hidden');
            setTimeout(() => lb.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('opacity-0');
            setTimeout(() => {
                lb.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            if (!projectId) { window.location.href = 'index.html'; return; }

            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) return;

                // TEXT FIELDS
                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-metric').innerText = project.metric;
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                // IMAGES
                let images = Array.isArray(project.images) ? project.images : [project.image];
                if(images.length > 0) {
                    document.getElementById('p-main-image').src = images[0];
                }
                if (images.length > 1) {
                    const gallery = document.getElementById('gallery-grid');
                    images.slice(1).forEach(imgSrc => {
                        gallery.innerHTML += `
                            <div class="rounded-lg overflow-hidden border border-bg-border h-24 cursor-pointer hover:border-accent-500 transition-colors" onclick="openLightbox('${imgSrc}')">
                                <img src="${imgSrc}" class="w-full h-full object-cover">
                            </div>
                        `;
                    });
                }

                // TAGS
                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-xs font-mono text-accent-400 border border-accent-500/20 bg-accent-500/10 px-2 py-1 rounded">#${tag}</span>`;
                });

                // TECH STACK
                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `<li class="flex items-center gap-3"><span class="w-1.5 h-1.5 bg-accent-500 rounded-full"></span>${tech}</li>`;
                });

                // --- NEW FEATURES ---
                
                // VIDEO EMBED
                if (project.video_embed && project.video_embed !== "") {
                    const videoContainer = document.getElementById('video-container');
                    const videoFrame = document.getElementById('p-video');
                    videoFrame.src = project.video_embed;
                    videoContainer.classList.remove('hidden');
                }

                // DOWNLOAD/GITHUB BUTTON
                if (project.workflow_download && project.workflow_download !== "") {
                    const btn = document.getElementById('btn-download');
                    btn.href = project.workflow_download;
                    btn.classList.remove('hidden');
                }

                // REVEAL CONTENT
                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => content.classList.remove('opacity-0'), 50);

            } catch (error) { console.error(error); }
        }
        loadProjectDetails();
    </script>
</body>
</html>
