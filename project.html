<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { accent: { 400: '#34d399', 500: '#10b981' }, bg: { main: '#0a0a0a', card: '#111111', border: '#262626' } }
                }
            }
        }
    </script>
    <style>body { background-color: #0a0a0a; color: #d4d4d8; }</style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="w-full border-b border-bg-border bg-bg-main sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Back to Projects
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 flex-grow w-full">
        <div id="loading" class="py-20 text-center text-gray-500 font-mono animate-pulse">Loading System Data...</div>

        <div id="project-content" class="hidden opacity-0 transition-opacity duration-500">
            <header class="mb-12">
                <div class="flex gap-2 mb-6" id="tags-container"></div>
                <h1 id="p-title" class="text-4xl md:text-6xl font-bold text-white mb-6"></h1>
                <p id="p-desc" class="text-xl text-gray-400 font-light max-w-2xl"></p>
            </header>

            <div class="rounded-xl overflow-hidden border border-bg-border mb-16 bg-bg-card">
                <img id="p-image" src="" class="w-full h-64 md:h-[500px] object-cover opacity-80" alt="Dashboard">
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                
                <div class="lg:col-span-4 space-y-8 order-2 lg:order-1">
                    <div class="p-6 border border-bg-border bg-bg-card rounded-xl">
                        <h3 class="text-gray-500 font-mono text-xs uppercase mb-1">Impact Metric</h3>
                        <p id="p-metric" class="text-accent-400 font-bold text-2xl"></p>
                    </div>

                    <div class="p-6 border border-bg-border bg-bg-card rounded-xl">
                        <h3 class="text-gray-500 font-mono text-xs uppercase mb-4">Tech Stack</h3>
                        <ul id="tech-list" class="space-y-3 text-sm text-gray-300"></ul>
                    </div>
                    
                    <a href="mailto:your-email@gmail.com" class="block w-full py-4 bg-white text-black text-center font-bold rounded-lg hover:bg-gray-200 transition">
                        Need something similar?
                    </a>
                </div>

                <div class="lg:col-span-8 space-y-12 order-1 lg:order-2">
                    <section>
                        <h2 class="text-xl text-white font-bold mb-4">The Challenge</h2>
                        <p id="p-problem" class="text-gray-400 leading-relaxed text-lg font-light"></p>
                    </section>

                    <section>
                        <h2 class="text-xl text-white font-bold mb-4">The Solution</h2>
                        <p id="p-solution" class="text-gray-400 leading-relaxed text-lg font-light"></p>
                    </section>
                    
                    <section class="bg-bg-card border border-bg-border p-8 rounded-xl">
                        <h2 class="text-accent-500 font-mono text-xs uppercase tracking-widest mb-3">FINAL OUTPUT</h2>
                        <p id="p-result" class="text-white text-xl font-medium"></p>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-8 text-gray-600 text-xs font-mono border-t border-bg-border mt-12">
        &copy; 2026 Priyo Das
    </footer>

    <script>
        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            if (!projectId) { window.location.href = 'index.html'; return; }

            try {
                const response = await fetch('projects.json');
                const projects = await response.json();
                const project = projects.find(p => p.id === projectId);

                if (!project) return;

                document.getElementById('p-title').innerText = project.title;
                document.getElementById('p-desc').innerText = project.description;
                document.getElementById('p-image').src = project.image;
                document.getElementById('p-metric').innerText = project.metric;
                document.getElementById('p-problem').innerText = project.full_details.problem;
                document.getElementById('p-solution').innerText = project.full_details.solution;
                document.getElementById('p-result').innerText = project.full_details.result;

                const tagsContainer = document.getElementById('tags-container');
                project.tags.forEach(tag => {
                    tagsContainer.innerHTML += `<span class="text-xs font-mono text-accent-400 border border-accent-500/20 bg-accent-500/10 px-2 py-1 rounded">#${tag}</span>`;
                });

                const techList = document.getElementById('tech-list');
                project.full_details.tech_stack.forEach(tech => {
                    techList.innerHTML += `<li class="flex items-center gap-3"><span class="w-1.5 h-1.5 bg-accent-500 rounded-full"></span>${tech}</li>`;
                });

                document.getElementById('loading').classList.add('hidden');
                const content = document.getElementById('project-content');
                content.classList.remove('hidden');
                setTimeout(() => content.classList.remove('opacity-0'), 50);

            } catch (error) { console.error(error); }
        }
        loadProjectDetails();
    </script>
</body>
</html>
